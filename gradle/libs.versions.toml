[versions]
# Best-effort versions as of this session's knowledge cutoff (Jan 2026).
# UNVERIFIED: this sandbox has no JDK/Gradle/network, so nothing here has been
# resolved against a real repository. Bump everything via Android Studio's
# version catalog / upgrade assistant before the first real build.
agp = "8.7.3"
kotlin = "2.1.0"
coroutines = "1.9.0"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"
room = "2.6.1"
datastore = "1.1.1"
maplibre = "11.6.1"
securityCrypto = "1.1.0"
tink = "1.8.0"
robolectric = "4.14.1"
zxing = "3.5.3"
zxingAndroidEmbedded = "4.3.0"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
# Pure-Java X25519 (com.google.crypto.tink.subtle.X25519), used by DirectMessageCrypto for
# ECDH instead of java.security.spec.XECPrivateKeySpec/"XDH" — that JDK 11+ API isn't present on
# Android below API 33 (NoClassDefFoundError on real API-31 hardware, see PLAN.md Фаза 33.9) and
# minSdk here is 26. Already a transitive dependency via androidx-security-crypto → same version
# pinned explicitly so `protocol` (plain kotlin("jvm"), no Android dependency otherwise) can use it
# directly without relying on what another module happens to resolve.
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
# MapLibre Native for Android — chosen over Google Maps because it has no Play
# Services dependency and works on GMS-less devices (e.g. Huawei). Artifact
# coordinates below are unverified in this sandbox; confirm on
# https://github.com/maplibre/maplibre-native before first sync.
maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
# QR generation/scanning — chosen over Google's ML Kit barcode scanning because that requires
# Google Play Services (the project's no-GMS constraint). Both are Apache-2.0, no GMS dependency.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingAndroidEmbedded" }
junit = { group = "junit", name = "junit", version = "4.13.2" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.1.0-1.0.29" }
