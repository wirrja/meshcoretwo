name: release apk

# Собирает подписанный APK на стороне GitHub при пуше тега `v*` (его создаёт export-public.sh)
# и прикладывает к GitHub Release. Ключ подписи берётся из секретов репозитория:
#   KEYSTORE_BASE64    — содержимое app/release-key.jks в base64 (`base64 -w0 < app/release-key.jks`)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Без секретов сборка идёт, но APK получается неподписанным (Android его не установит) — джоб
# предупредит об этом и всё равно выложит файл как артефакт.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Секреты подписи не заданы — APK будет неподписанным"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks
          {
            echo "storeFile=app/release-key.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # gradle.properties пришпиливает org.gradle.java.home к локальному пути машины разработки;
      # на раннере переопределяем его значением от setup-java (как в protocol-tests.yml).
      - name: Build release APK
        run: ./gradlew :app:assembleRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          src=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          suffix=""; [ "${{ steps.signing.outputs.signed }}" = "true" ] || suffix="-UNSIGNED"
          cp "$src" "dist/MeshCoreTwo-${GITHUB_REF_NAME}${suffix}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Signed APK for sideloading. Unofficial port; see the README for origin and license.

          ### Notes
          - The app now keeps the radio link alive with the screen off and shows one ongoing
            notification while it does. Switch it off in Settings → Notifications → "Keep connection in background".
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "MeshCore Two ${GITHUB_REF_NAME}" \
            --notes-file notes.md
